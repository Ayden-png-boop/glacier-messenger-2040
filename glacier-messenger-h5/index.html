<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f172a" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />

    <title>冰川信使：斑头雁的2040</title>
    <meta
      name="description"
      content="《冰川信使：斑头雁的2040》— 一个关于气候变化的互动故事。你将决定雁群的命运。"
    />

    <!-- 首屏关键资源：第一章封面图先于 JS 到达，避免白屏 -->
    <link rel="preload" as="image" href="./posters/ch01_glacier_crack.webp" fetchpriority="high" />

    <style>
      /* 首屏防白屏：在 React 挂载前就铺好深色底 + 中心 loading */
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0f172a;
        overscroll-behavior-y: none;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: linear-gradient(to bottom, #0f172a, #1e3a8a 55%, #1e293b);
        color: #a5f3fc;
        font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        z-index: 1;
        transition: opacity 0.45s ease;
      }
      #boot .ring {
        width: 46px;
        height: 46px;
        border: 3px solid #22d3ee;
        border-top-color: transparent;
        border-radius: 50%;
        animation: bootspin 0.9s linear infinite;
      }
      #boot .txt {
        font-size: 13px;
        letter-spacing: 0.16em;
        opacity: 0.85;
      }
      @keyframes bootspin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="boot">
      <div class="ring"></div>
      <div class="txt">GLACIER MESSENGER 2040</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
